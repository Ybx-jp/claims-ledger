  <rect class="greek" x="32" y="128" width="280" height="6" rx="3"/>
  <rect class="greek" x="32" y="144" width="316" height="6" rx="3"/>
  <rect class="mark" x="110.5" y="141.5" width="140" height="11" rx="3"/>
  <rect class="greek" x="32" y="160" width="260" height="6" rx="3"/>
  <rect class="greek" x="32" y="176" width="296" height="6" rx="3"/>
  <rect class="greek" x="32" y="192" width="180" height="6" rx="3"/>
</g>

<!-- ===== B: prose, later ===== -->
<g transform="translate(550 120)">
  <rect class="greek" x="16" y="16" width="300" height="6" rx="3"/>
  <rect class="bar" x="16" y="32" width="260" height="10" rx="5"/>
  <rect class="mark" x="150.5" y="32.5" width="110" height="9" rx="4.5"/>
  <rect class="greek" x="16" y="54" width="220" height="6" rx="3"/>
  <rect class="card" x="16.5" y="96.5" width="348" height="110" rx="3"/>
  <rect class="greek" x="32" y="112" width="240" height="6" rx="3"/>
  <rect class="greek" x="32" y="128" width="316" height="6" rx="3"/>
  <rect class="greek" x="32" y="144" width="70" height="6" rx="3"/>
  <rect class="ghost" x="110.5" y="141.5" width="140" height="11" rx="3"/>
  <rect class="greek" x="258" y="144" width="80" height="6" rx="3"/>
  <rect class="greek" x="32" y="160" width="300" height="6" rx="3"/>
  <rect class="greek" x="32" y="176" width="250" height="6" rx="3"/>
  <rect class="greek" x="32" y="192" width="120" height="6" rx="3"/>
  <text class="serif muted small" x="16" y="226">nothing happens</text>
</g>

<!-- ===== C: ledger, when written ===== -->
<g transform="translate(110 380)">
  <rect class="greek" x="16" y="16" width="300" height="6" rx="3"/>
  <rect class="bar" x="16" y="32" width="260" height="10" rx="5"/>
  <rect class="soft" x="150.5" y="32.5" width="110" height="9" rx="4.5"/>
  <rect class="chip" x="290.5" y="28.5" width="82" height="17" rx="8.5"/><text class="mono muted code11" x="331.5" y="40" text-anchor="middle">corroborated</text>
  <rect class="greek" x="16" y="54" width="220" height="6" rx="3"/>
  <rect class="card" x="16.5" y="96.5" width="348" height="110" rx="3"/>
  <rect class="greek" x="32" y="112" width="300" height="6" rx="3"/>
  <rect class="greek" x="32" y="128" width="280" height="6" rx="3"/>
  <rect class="greek" x="32" y="144" width="316" height="6" rx="3"/>
  <rect class="soft" x="110.5" y="141.5" width="140" height="11" rx="3"/>
  <rect class="greek" x="32" y="160" width="260" height="6" rx="3"/>
  <rect class="greek" x="32" y="176" width="296" height="6" rx="3"/>
  <rect class="greek" x="32" y="192" width="180" height="6" rx="3"/>
  <path class="tether" d="M205 42 C 205 95 180 95 180 141"/>
  <circle class="dot" cx="205" cy="42" r="2.5"/><circle class="dot" cx="180" cy="141" r="2.5"/>
  <text class="mono muted code11" x="364" y="226" text-anchor="end">sha256 · 3f9a2c…</text>
</g>

<!-- ===== D: ledger, later ===== -->
<g transform="translate(550 380)">
  <rect class="greek" x="16" y="16" width="300" height="6" rx="3"/>
  <rect class="bar" x="16" y="32" width="260" height="10" rx="5"/>
  <rect class="soft" x="150.5" y="32.5" width="110" height="9" rx="4.5"/>
  <rect class="achip" x="290.5" y="28.5" width="69" height="17" rx="8.5"/><text class="mono accent code11" x="325" y="40" text-anchor="middle">contested</text>
  <rect class="greek" x="16" y="54" width="220" height="6" rx="3"/>
  <rect class="card" x="16.5" y="96.5" width="348" height="110" rx="3"/>
  <rect class="greek" x="32" y="112" width="240" height="6" rx="3"/>
  <rect class="greek" x="32" y="128" width="316" height="6" rx="3"/>
  <rect class="greek" x="32" y="144" width="70" height="6" rx="3"/>
  <rect class="aghost" x="110.5" y="141.5" width="140" height="11" rx="3"/>
  <rect class="greek" x="258" y="144" width="80" height="6" rx="3"/>
  <rect class="greek" x="32" y="160" width="300" height="6" rx="3"/>
  <rect class="greek" x="32" y="176" width="250" height="6" rx="3"/>
  <rect class="greek" x="32" y="192" width="120" height="6" rx="3"/>
  <path class="atether" d="M205 42 C 205 95 180 95 180 141"/>
  <circle class="dot" cx="205" cy="42" r="2.5"/><circle class="adot" cx="180" cy="141" r="2.5"/>
  <text class="serif accent small" x="16" y="226">caught</text>
  <text class="mono accent code11" x="364" y="226" text-anchor="end">sha256 · c71e08…</text>
</g>
</svg>
