<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 865" width="960" height="865" font-size="13" role="img" aria-labelledby="t d">
<title id="t">Anatomy of a ledger entry</title>
<desc id="d">An entry file annotated part by part: frontmatter, then Assertion, Scope, Grounds, Warrant and Backing in a region that is frozen once committed; then the APPEND marker; then Verdicts and References, which only ever grow.</desc>
<style>
svg { --paper: #FAF8F3; --ink: #1C1B18; --muted: #77726A; --rule: #D9D4C7; --panel: #F0ECE2; --mark: #E6E0D2; --accent: #B8451F; --accent-soft: #F7DED2; }
.paper{fill:var(--paper)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .accent{fill:var(--accent)}
.panel{fill:var(--panel)} .mark{fill:var(--mark)}
.rule{stroke:var(--rule);fill:none;stroke-width:1} .lead{stroke:var(--muted);fill:none;stroke-width:1}
.seam{stroke:var(--accent);fill:none;stroke-width:1.25;stroke-dasharray:5 4}
.serif{font-family:Charter,"Bitstream Charter","Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono","DejaVu Sans Mono",monospace}
.title{font-size:22px} .sub{font-size:14px} .h{font-size:10.5px;letter-spacing:.14em} .body{font-size:12.5px} .small{font-size:11px}
.code{font-size:11.5px} .label{font-size:12.5px;font-weight:600}
</style>
<rect class="paper" width="960" height="865"/>
<text class="serif ink title" x="40" y="44">Anatomy of an entry</text>
<text class="serif muted sub" x="40" y="68">One file, two regions. Above the marker nothing changes; below it, things are only ever added.</text>

<rect class="panel" x="70" y="84" width="560" height="612" rx="3"/>
<rect class="rule" x="70.5" y="84.5" width="559" height="740" rx="3"/>
<path class="seam" d="M70 696 H630"/>
<text class="serif muted h" transform="translate(52 390) rotate(-90)" text-anchor="middle">FROZEN AFTER THE COMMIT THAT CREATES IT</text>
<text class="serif accent h" transform="translate(52 760) rotate(-90)" text-anchor="middle">APPEND ONLY</text>
<g class="mono code">
<text class="muted" x="86" y="112">---</text>
<text class="ink" x="86" y="129">id: A0001-stale-fraction-governs-error</text>
<text class="ink" x="86" y="146">kind: claim</text>
<text class="ink" x="86" y="163">stated: 2026-09-04T12:00:00-07:00</text>
<text class="ink" x="86" y="180">author: main</text>
<text class="ink" x="86" y="197">grade: measured</text>
<text class="ink" x="86" y="214">supersedes: none</text>
<text class="ink" x="86" y="231">verbatim_sha: 3b47609bdcdf…</text>
<text class="muted" x="86" y="248">---</text>
<text class="muted" x="86" y="282">## Assertion</text>
<text class="ink" x="86" y="299">The mean aggregation error is governed by the</text>
<text class="ink" x="86" y="316">stale fraction and not by degree.</text>
<text class="muted" x="86" y="350">## Scope</text>
<text class="ink" x="86" y="367">metric: mean L2 error of the aggregated representation</text>
<text class="ink" x="86" y="384">cohort: the synthetic demo graph</text>
<text class="ink" x="86" y="401">condition: mean aggregation, one layer</text>
<text class="muted" x="86" y="435">## Grounds</text>
<text class="ink" x="86" y="452">- lab: notes/001.md § "Observation" @9fceb02</text>
<text class="ink" x="86" y="469">- source: fx-paper · whole text</text>
<text class="muted" x="86" y="503">## Warrant</text>
<text class="ink" x="86" y="520">A measured error at a known stale fraction, with the</text>
<text class="ink" x="86" y="537">source stating the same rule, supports the assertion</text>
<text class="ink" x="86" y="554">over this cohort.</text>
<text class="muted" x="86" y="588">## Backing</text>
<text class="ink" x="86" y="605">- source: fx-paper · whole text</text>
<text class="ink" x="86" y="622">  speaker: Okafor</text>
<text class="ink" x="86" y="639">  quote: "The error under mean aggregation scales with</text>
<text class="ink" x="86" y="656">  the stale fraction and does not grow with degree."</text>
<text class="accent" x="86" y="690">&lt;!-- APPEND BELOW THIS LINE ONLY --&gt;</text>
<text class="muted" x="86" y="724">## Verdicts</text>
<text class="ink" x="86" y="741">- 2026-09-10T08:00:00-07:00 · corroborated · grade: measured · author: main</text>
<text class="ink" x="86" y="758">  evidence: lab: notes/002.md § "Replication sweep" @c41e9a0</text>
<text class="muted" x="86" y="792">## References</text>
<text class="ink" x="86" y="809">- README.md · standing · cites-as-live</text>
</g>
<path class="lead" d="M634 176 H646 V130" stroke-linejoin="round"/>
<circle class="muted" cx="634" cy="176" r="2"/>
<text class="serif ink label" x="660" y="134">Publication info</text>
<text class="serif muted body" x="660" y="151">kind, stated, author, grade — an evidence type,</text>
<text class="serif muted body" x="660" y="166">not a rank. verbatim_sha fingerprints Scope and</text>
<text class="serif muted body" x="660" y="181">Backing; a declared value that differs is malformed.</text>
<path class="lead" d="M634 295 H646 V282" stroke-linejoin="round"/>
<circle class="muted" cx="634" cy="295" r="2"/>
<text class="serif ink label" x="660" y="286">Assertion</text>
<text class="serif muted body" x="660" y="303">The claim in the project's words.</text>
<text class="serif muted body" x="660" y="318">No quotation mark may appear in it.</text>
<path class="lead" d="M634 380 H646 V350" stroke-linejoin="round"/>
<circle class="muted" cx="634" cy="380" r="2"/>
<text class="serif ink label" x="660" y="354">Scope</text>
<text class="serif muted body" x="660" y="371">metric, cohort, condition. Required at measured</text>
<text class="serif muted body" x="660" y="386">and above; the assertion claims exactly this.</text>
<path class="lead" d="M634 448 H646 V435" stroke-linejoin="round"/>
<circle class="muted" cx="634" cy="448" r="2"/>
<text class="serif ink label" x="660" y="439">Grounds</text>
<text class="serif muted body" x="660" y="456">Typed pointers, pinned to a commit. The grade</text>
<text class="serif muted body" x="660" y="471">is the type of the evidence they name.</text>
<path class="lead" d="M634 533 H646 V503" stroke-linejoin="round"/>
<circle class="muted" cx="634" cy="533" r="2"/>
<text class="serif ink label" x="660" y="507">Warrant</text>
<text class="serif muted body" x="660" y="524">The rule by which the grounds support</text>
<text class="serif muted body" x="660" y="539">the assertion.</text>
<path class="lead" d="M634 618 H646 V588" stroke-linejoin="round"/>
<circle class="muted" cx="634" cy="618" r="2"/>
<text class="serif ink label" x="660" y="592">Backing</text>
<text class="serif muted body" x="660" y="609">Every verbatim quotation with its speaker, held</text>
<text class="serif muted body" x="660" y="624">to the bytes of its registered source.</text>
<path class="lead" d="M634 686 H646 V646" stroke-linejoin="round"/>
<circle class="muted" cx="634" cy="650" r="2"/>
<text class="serif ink label" x="660" y="650">The seam</text>
<text class="serif muted body" x="660" y="667">Above: immutable once committed. Below: only</text>
<text class="serif muted body" x="660" y="682">appends. Both are checked against git history,</text>
<text class="serif muted body" x="660" y="697">not against the file.</text>
<path class="lead" d="M634 737 H646 V724" stroke-linejoin="round"/>
<circle class="muted" cx="634" cy="737" r="2"/>
<text class="serif ink label" x="660" y="728">Verdicts</text>
<text class="serif muted body" x="660" y="745">One row each, timestamps non-decreasing.</text>
<text class="serif muted body" x="660" y="760">The last legal one derives the status; none</text>
<text class="serif muted body" x="660" y="775">is ever edited or removed.</text>
<path class="lead" d="M634 805 H646 V792" stroke-linejoin="round"/>
<circle class="muted" cx="634" cy="805" r="2"/>
<text class="serif ink label" x="660" y="796">References</text>
<text class="serif muted body" x="660" y="813">The documents that cite this entry, held</text>
<text class="serif muted body" x="660" y="828">to its current status both ways.</text>
</svg>