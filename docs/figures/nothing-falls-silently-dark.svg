<rect class="greek" x="176" y="126" width="220" height="6" rx="3"/>
<rect class="greek" x="176" y="142" width="200" height="6" rx="3"/>
<rect class="greek" x="176" y="158" width="20" height="6" rx="3"/><rect class="pill" x="200" y="157" width="44" height="8" rx="4"/><rect class="greek" x="250" y="158" width="140" height="6" rx="3"/>
<rect class="greek" x="176" y="174" width="228" height="6" rx="3"/>
<rect class="greek" x="176" y="190" width="150" height="6" rx="3"/><rect class="apill" x="330" y="189" width="44" height="8" rx="4"/>
<rect class="greek" x="176" y="206" width="120" height="6" rx="3"/>

<rect class="card" x="560.5" y="110.5" width="260" height="110" rx="3"/>
<rect class="greek" x="576" y="126" width="228" height="6" rx="3"/>
<rect class="greek" x="576" y="142" width="20" height="6" rx="3"/><rect class="apill" x="600" y="141" width="44" height="8" rx="4"/><rect class="greek" x="650" y="142" width="150" height="6" rx="3"/>
<rect class="greek" x="576" y="158" width="210" height="6" rx="3"/>
<rect class="greek" x="576" y="174" width="140" height="6" rx="3"/><rect class="pill" x="720" y="173" width="44" height="8" rx="4"/>
<rect class="greek" x="576" y="190" width="224" height="6" rx="3"/>
<rect class="greek" x="576" y="206" width="90" height="6" rx="3"/>

<!-- ===== claims ===== -->
<g id="c1" transform="translate(100 336)"><rect class="entry" x="0.5" y="0.5" width="140" height="48" rx="3"/><rect class="bar" x="12" y="12" width="116" height="8" rx="4"/><rect class="soft" x="60.5" y="12.5" width="44" height="7" rx="3.5"/></g>
<g id="c2" transform="translate(270 336)"><rect class="entry" x="0.5" y="0.5" width="140" height="48" rx="3"/><rect class="bar" x="12" y="12" width="116" height="8" rx="4"/><rect class="soft" x="60.5" y="12.5" width="44" height="7" rx="3.5"/><rect class="achip" x="69.5" y="27.5" width="63" height="15" rx="7.5"/><text class="mono accent code11" x="101" y="38.5" text-anchor="middle">refuted</text></g>
<g id="c3" transform="translate(440 336)"><rect class="aentry" x="0.5" y="0.5" width="140" height="48" rx="3"/><rect class="bar" x="12" y="12" width="116" height="8" rx="4"/><rect class="soft" x="60.5" y="12.5" width="44" height="7" rx="3.5"/><rect class="achip" x="63.5" y="27.5" width="69" height="15" rx="7.5"/><text class="mono accent code11" x="98" y="38.5" text-anchor="middle">contested</text></g>
<g id="c4" transform="translate(610 336)"><rect class="entry" x="0.5" y="0.5" width="140" height="48" rx="3"/><rect class="bar" x="12" y="12" width="116" height="8" rx="4"/><rect class="soft" x="60.5" y="12.5" width="44" height="7" rx="3.5"/></g>
<g id="c5" transform="translate(780 336)"><rect class="entry" x="0.5" y="0.5" width="140" height="48" rx="3"/><rect class="bar" x="12" y="12" width="116" height="8" rx="4"/><rect class="soft" x="60.5" y="12.5" width="44" height="7" rx="3.5"/></g>

<!-- claim cites claim: C3 rests on C2 -->
<path class="atether" d="M470 336 C 470 298 380 298 380 336" marker-end="url(#aa)"/>

