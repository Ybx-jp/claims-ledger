<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-size="13" role="img" aria-labelledby="t d">
<title id="t">When one claim falls, everything resting on it says so</title>
<desc id="d">Three layers: two documents on top, five claims in the middle, three sources at the bottom, with lines tying each document citation to a claim and each claim's quotation to a span of a source. One claim in the middle row carries a refuted verdict. From it, a highlighted path runs to the claim that cited it, now marked contested; to the document citation that named the refuted claim; and to the document citation that named the contested one. Every other line, claim and source is unmarked.</desc>
<style>
svg { --paper: #161513; --ink: #ECE8DF; --muted: #9C968B; --rule: #3A3732; --panel: #201E1B; --mark: #2E2B26; --accent: #F0855A; --accent-soft: #41251A; }
.paper{fill:var(--paper)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .accent{fill:var(--accent)}
.greek{fill:var(--rule)} .bar{fill:var(--ink)} .soft{fill:var(--accent-soft);stroke:var(--ink);stroke-width:1}
.card{fill:var(--paper);stroke:var(--rule);stroke-width:1} .entry{fill:var(--paper);stroke:var(--ink);stroke-width:1}
.aentry{fill:var(--paper);stroke:var(--accent);stroke-width:1;stroke-dasharray:4 3}
.tether{stroke:var(--ink);fill:none;stroke-width:1.25} .atether{stroke:var(--accent);fill:none;stroke-width:1.25}
.dot{fill:var(--ink)} .adot{fill:var(--accent)} .pill{fill:var(--ink)} .apill{fill:var(--accent)}
.achip{fill:var(--paper);stroke:var(--accent);stroke-width:1}
.serif{font-family:Charter,"Bitstream Charter","Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono","DejaVu Sans Mono",monospace}
.title{font-size:22px} .h{font-size:11px;letter-spacing:.14em} .code11{font-size:11px}
</style>
<defs><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="accent" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<rect class="paper" width="960" height="640"/>

<text class="serif ink title" x="40" y="46">When one claim falls, everything resting on it says so.</text>

<!-- layer labels -->
<text class="serif muted h" transform="rotate(-90 62 165)" x="62" y="165" text-anchor="middle">DOCUMENTS</text>
<text class="serif muted h" transform="rotate(-90 62 360)" x="62" y="360" text-anchor="middle">CLAIMS</text>
<text class="serif muted h" transform="rotate(-90 62 535)" x="62" y="535" text-anchor="middle">SOURCES</text>

<!-- ===== documents ===== -->
