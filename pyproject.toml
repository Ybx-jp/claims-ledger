[project]
name = "claims-ledger"
# Read from src/claims_ledger/__init__.py, so the version lives in exactly one place.
dynamic = ["version"]
description = "A checked claims ledger: entries that separate assertion, grounds, warrant and backing, hold every quotation to its source, and derive status from an append-only verdict list"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jackson Porter" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["provenance", "argumentation", "nanopublication", "research", "citation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup :: Markdown",
]

dependencies = []
# No runtime dependencies, deliberately. The checkers run from a plain `python3` in a
# pre-commit hook, on a checkout with nothing installed; tomllib is standard library
# from 3.11, which is what sets the floor.
# Ledger: (L0011-no-runtime-dependencies, cites-as-live). Below the key and not above it:
# a `toml-key` section starts at its own line, so a comment above `dependencies` belongs
# to whatever key precedes it.

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.14", "ty>=0.0.78"]

[project.scripts]
claims-ledger = "claims_ledger.cli:main"

[project.urls]
Homepage = "https://github.com/Ybx-jp/claims-ledger"
Issues = "https://github.com/Ybx-jp/claims-ledger/issues"
Changelog = "https://github.com/Ybx-jp/claims-ledger/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/claims_ledger/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/claims_ledger"]

# The corpus sits inside src/claims_ledger so the wheel carries it: `claims-ledger corpus`
# is how an installed copy proves itself. See QUALITY.md.

[tool.hatch.build.targets.sdist]
# Anchored with a leading `/`: an unanchored `README.md` is a gitignore-style pattern that
# matches at any depth, and pulled a stray README out of `.qe` into the sdist.
#
# `/examples` is named because `tests/` ships and four of its tests read the portfolio: an
# unanchored list once carried 10 of the 45 example files — the ones whose own directory
# happened to be called `src` or `docs` — and the suite inside the sdist could not pass.
# `release.yml` runs that suite from an extracted sdist, which is what holds this line.
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/README.md",
    "/QUALITY.md",
    "/CHANGELOG.md",
    "/LICENSE",
]
exclude = ["/docs/videos"]
# The film's Remotion project moved under `docs/` to sit beside `docs/figures/`, and `/docs`
# ships whole — so without this line the sdist grew by 11 MB of GIFs, fonts and a
# package-lock nothing in the distribution reads. Excluded rather than left in: the tarball
# is what `pip install` downloads, and the two rendered GIFs are served from the repository
# to the README. Anchored like every `include` entry, for the same reason.

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
# The floor, not the newest interpreter: a 3.12-only construct must fail here, not for a user.
python-version = "3.11"

[tool.ty.src]
include = ["src", "tests"]
# Ledger fixtures, deliberately malformed; no Python in them.
exclude = ["src/claims_ledger/corpus/seeds"]

[tool.ruff]
line-length = 100
target-version = "py311"
# None holds code this package maintains. `.qe` and `docs/audits` are an audit pass's own
# record — its probes and the snippets in its findings are evidence, and reformatting one
# would edit what was run. The seeds are malformed on purpose, and one is deliberately
# not UTF-8, which no formatter can read.
exclude = [".qe", "docs/audits", "src/claims_ledger/corpus/seeds"]

[tool.ruff.lint]
# Pinned rather than tracking ruff's default select, which grows between releases: CI fails
# on this project's rules, not on whatever the newest ruff turned on. E731 comes in with E,
# which the deliberate `fail = lambda …` suppressions in the checkers were written against.
select = ["E", "F", "I", "B", "SIM", "UP", "RUF", "ISC", "BLE", "PLW", "FURB"]

# The schema's own pointer syntax uses these: `lab: notes/001.md § "Observation"`. They are
# the characters it means, not homoglyphs slipped in by an editor.
allowed-confusables = ["–", "—", "·", "§", "×", "≤", "≥"]

[tool.ruff.lint.pycodestyle]
# ruff format wraps code at line-length; these are the prose lines it cannot break.
max-line-length = 100

[tool.ruff.lint.flake8-implicit-str-concat]
allow-multiline = true

# The package keeps a ledger of the claims about itself, under `ledger/`: the design
# commitments its README and its comments state, each pinned to the function or table
# that keeps it true, so `claims-ledger check` fails the citing sentence when the pinned
# code moves. A citation in a document or a comment reads `(L0001-<slug>, cites-as-live)`.
# The documents are named one by one rather than as `*.md`: the corpus seeds and the
# example templates carry citations of ids that live in other ledgers, and an audit report
# at the root that shows the syntax is not citing anything.
[tool.claims-ledger]
documents = [
    "README.md",
    "CHANGELOG.md",
    # The working instructions state commitments about the code in the same voice the
    # README does, so a citation written there is checked rather than silently ignored.
    "CLAUDE.md",
    "docs/*.md",
    "pyproject.toml",
    "src/claims_ledger/*.py",
]
citation-placement = "fail"
# On, and failing rather than flagging: every citation in this project sits inside the
# span its entry pins, so a new one that does not is a mistake with a known repair and
# no judgement to make. A project adopting the rule mid-life wants `flag` until its
# existing citations are moved.
evidence-sectioned = ["code", "toml", "toml-key"]
evidence-plain = []

[tool.claims-ledger.section-patterns]
# A section of a source file is a top-level def, class or assignment, and runs to the next
# one. The lookahead keeps an indented assignment from ending a function at its first
# local. A section of a TOML file is a table — and `toml-key` is one key of one, for a
# claim about a single setting: the whole `[project]` table was the finest ground the
# dependency claim could take, so adding a classifier moved a claim about `dependencies`.
# The space before `=` is what keeps the boundary off a `>=` inside an array element.
code = '^(?![ \t])(?:(?:def|class)[ \t]+{name}\b|{name}[ \t]*=)'
toml = '^\[{name}\]'
toml-key = '^{name} = '
