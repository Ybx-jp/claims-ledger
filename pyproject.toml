[project]
name = "claims-ledger"
# Read from src/claims_ledger/__init__.py, so the version lives in exactly one place.
dynamic = ["version"]
description = "A checked claims ledger: entries that separate assertion, grounds, warrant and backing, hold every quotation to its source, and derive status from an append-only verdict list"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jackson Porter" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["provenance", "argumentation", "nanopublication", "research", "citation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup :: Markdown",
]

# No runtime dependencies, deliberately. The checkers run from a plain `python3` in a
# pre-commit hook, on a checkout with nothing installed; tomllib is standard library
# from 3.11, which is what sets the floor.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.14", "ty>=0.0.78"]

[project.scripts]
claims-ledger = "claims_ledger.cli:main"

[project.urls]
Homepage = "https://github.com/Ybx-jp/claims-ledger"
Issues = "https://github.com/Ybx-jp/claims-ledger/issues"
Changelog = "https://github.com/Ybx-jp/claims-ledger/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/claims_ledger/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/claims_ledger"]

# The corpus sits inside src/claims_ledger so the wheel carries it: `claims-ledger corpus`
# is how an installed copy proves itself. See QUALITY.md.

[tool.hatch.build.targets.sdist]
# Anchored with a leading `/`: an unanchored `README.md` is a gitignore-style pattern that
# matches at any depth, and pulled a stray README out of `.qe` into the sdist.
include = ["/src", "/tests", "/docs", "/README.md", "/QUALITY.md", "/CHANGELOG.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
# The floor, not the newest interpreter: a 3.12-only construct must fail here, not for a user.
python-version = "3.11"

[tool.ty.src]
include = ["src", "tests"]
# Ledger fixtures, deliberately malformed; no Python in them.
exclude = ["src/claims_ledger/corpus/seeds"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Neither holds code this package maintains. `.qe` is an audit pass's own record — its
# probes are evidence, and reformatting one would edit what was run. The seeds are
# malformed on purpose, and one is deliberately not UTF-8, which no formatter can read.
exclude = [".qe", "src/claims_ledger/corpus/seeds"]

[tool.ruff.lint]
# Pinned rather than tracking ruff's default select, which grows between releases: CI fails
# on this project's rules, not on whatever the newest ruff turned on. E731 comes in with E,
# which the deliberate `fail = lambda …` suppressions in the checkers were written against.
select = ["E", "F", "I", "B", "SIM", "UP", "RUF", "ISC", "BLE", "PLW", "FURB"]

# The schema's own pointer syntax uses these: `lab: notes/001.md § "Observation"`. They are
# the characters it means, not homoglyphs slipped in by an editor.
allowed-confusables = ["–", "—", "·", "§", "×", "≤", "≥"]

[tool.ruff.lint.pycodestyle]
# ruff format wraps code at line-length; these are the prose lines it cannot break.
max-line-length = 100

[tool.ruff.lint.flake8-implicit-str-concat]
allow-multiline = true
