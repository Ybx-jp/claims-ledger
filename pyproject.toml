[project]
name = "claims-ledger"
# Read from src/claims_ledger/__init__.py, so the version lives in exactly one place.
dynamic = ["version"]
description = "A checked claims ledger: entries that separate assertion, grounds, warrant and backing, hold every quotation to its source, and derive status from an append-only verdict list"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jackson Porter" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["provenance", "argumentation", "nanopublication", "research", "citation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup :: Markdown",
]

# No runtime dependencies, deliberately. The checkers run from a plain `python3` in a
# pre-commit hook, on a checkout with nothing installed; tomllib is standard library
# from 3.11, which is what sets the floor.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.14", "ty>=0.0.78"]

[project.scripts]
claims-ledger = "claims_ledger.cli:main"

[project.urls]
Homepage = "https://github.com/Ybx-jp/claims-ledger"
Issues = "https://github.com/Ybx-jp/claims-ledger/issues"
Changelog = "https://github.com/Ybx-jp/claims-ledger/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/claims_ledger/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/claims_ledger"]

# The corpus ships with the package — it sits inside src/claims_ledger, so the wheel
# carries it. A checker is only trusted after it has passed the seeds, and
# `claims-ledger corpus` is how an installed copy proves itself.

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
# Checked against the floor rather than the newest interpreter: the package promises
# 3.11, and a 3.12-only construct would otherwise pass here and fail for a user.
python-version = "3.11"

[tool.ty.src]
include = ["src", "tests"]
# The red-team seeds are ledger fixtures, deliberately malformed; they contain no Python.
exclude = ["src/claims_ledger/corpus/seeds"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pinned explicitly rather than tracking ruff's default select, which grows between
# releases: CI has to fail on this project's rules, not on whatever the newest ruff
# turned on. These are every family ruff raised against this code, kept rather than
# narrowed. E731 comes in with E, which is what the deliberate `fail = lambda …`
# suppressions in the checkers were written against.
select = ["E", "F", "I", "B", "SIM", "UP", "RUF", "ISC", "BLE", "PLW", "FURB"]

# The prose here uses real typography, and the pointer syntax the schema defines is
# written with them: `source: fx-paper · whole text`, `lab: notes/001.md § "Observation"`.
# These are the characters the schema means, not homoglyphs slipped in by an editor.
allowed-confusables = ["–", "—", "·", "§", "×", "≤", "≥"]

[tool.ruff.lint.pycodestyle]
# ruff format wraps code at line-length; these are the prose lines it cannot break.
max-line-length = 100

[tool.ruff.lint.flake8-implicit-str-concat]
allow-multiline = true
