name: Release

# A tag is the only thing that publishes. Both artifacts that go to PyPI — the wheel and
# the sdist — are the ones this job built and then proved from a clean environment: the
# corpus runs against each installed artifact, not against the checkout, so a distribution
# that cannot prove itself never reaches the index.
#
# Every action below is pinned to a commit. A tag and a branch are both mutable, and
# `pypa/gh-action-pypi-publish@release/v1` was a branch, in the one job that holds
# `id-token: write` and can mint a PyPI token for this project.
on:
  push:
    tags: ["v*"]
  # A dispatch builds and proves; it publishes only when it is dispatched from a tag ref,
  # which is what the `publish` job's own condition says. Dispatching from a branch stops
  # after `build`.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - name: The suite, before anything is built
        # A tag matches neither of ci.yml's triggers, so without this the only thing
        # standing between a tag and PyPI would be the corpus. Publication is gated on
        # every check CI runs, not on a subset of them.
        run: |
          pip install -e ".[dev]"
          ruff check .
          ruff format --check .
          ty check
          pytest -q
      - run: python -m build
      - run: twine check --strict dist/*
      - name: The tag and the package agree on the version
        # A tag that says v0.1.1 over a package that says 0.1.0 would publish a release
        # nobody can name. Skipped for a manual run, which has no tag.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          version=$(/tmp/clean/bin/claims-ledger --version | awk '{print $2}')
          tag="${GITHUB_REF_NAME#v}"
          test "$version" = "$tag" || { echo "tag $tag, package $version"; exit 1; }
      - name: Each distribution proves itself from elsewhere
        # Both of them, not only the wheel: an sdist is what pip falls back to wherever a
        # wheel is refused, and `twine check` reads its metadata rather than running it.
        # The corpus rides inside the package, so a distribution that shipped a partial
        # one fails here — and an empty corpus is a non-zero exit rather than `0/0 seeds
        # pass`, which is what makes this step a gate at all.
        run: |
          test -d /tmp/clean || { python -m venv /tmp/clean; /tmp/clean/bin/pip install dist/*.whl; }
          mkdir -p /tmp/elsewhere && cd /tmp/elsewhere
          /tmp/clean/bin/claims-ledger corpus
          python -m venv /tmp/clean-sdist
          /tmp/clean-sdist/bin/pip install "$GITHUB_WORKSPACE"/dist/*.tar.gz
          /tmp/clean-sdist/bin/claims-ledger corpus
          /tmp/clean-sdist/bin/claims-ledger --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    # Only a tag publishes — including a `workflow_dispatch`, which GitHub allows to name
    # a tag ref and which then publishes exactly as a tag push does, with the
    # tag-agrees-with-package check above having run. Trusted Publishing binds the
    # repository, the workflow file and the environment — never the ref — so without this
    # condition a dispatch from any branch would publish whatever `__init__.py` said, with
    # that check skipped for having no tag to compare against.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    # Trusted Publishing: PyPI mints a short-lived token for this workflow, so there is
    # no long-lived secret in the repository. The project-settings publishing page
    # (pypi.org/manage/project/claims-ledger/settings/publishing/) does not exist until
    # something has already been uploaded, so the *first* publish instead needs an
    # account-level pending publisher, configured once at
    # https://pypi.org/manage/account/publishing/, naming this repository, the workflow
    # file `release.yml` and the environment `pypi` below — PyPI turns it into the
    # project's own publisher automatically on that first successful upload. The `pypi`
    # GitHub environment this job runs under also has to exist beforehand (Settings →
    # Environments in this repository); nothing here creates it. See RELEASING.md.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

  github_release:
    needs: publish
    # Same gate as `publish`, and dependent on it: a Release names a tag that actually
    # reached PyPI, never one that only got as far as `build`. Nothing else in this file
    # creates GitHub's own Release object — only the tag and the PyPI upload — and
    # CHANGELOG.md links every version heading straight to `releases/tag/vX.Y.Z`, which
    # 404s without one.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # `contents: write` is a wider grant than this file has anywhere else, so it is held
    # to one job: the top level stays `contents: read`, `build` and `publish` never see
    # it, and this job runs no code from the repository — `gh release create` talks to
    # the GitHub API directly and needs no checkout.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          name: dist
          path: dist/
      - name: Create the GitHub Release the CHANGELOG links to
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md for what this release contains." \
            dist/*
