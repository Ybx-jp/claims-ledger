name: Release

# A tag is the only thing that publishes. The wheel that goes to PyPI is the one this
# job built and then proved from a clean environment: the corpus runs against the
# installed artifact, not against the checkout, so a wheel that cannot prove itself
# never reaches the index.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: The tag and the package agree on the version
        # A tag that says v0.1.1 over a package that says 0.1.0 would publish a release
        # nobody can name. Skipped for a manual run, which has no tag.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          version=$(/tmp/clean/bin/claims-ledger --version | awk '{print $2}')
          tag="${GITHUB_REF_NAME#v}"
          test "$version" = "$tag" || { echo "tag $tag, package $version"; exit 1; }
      - name: The wheel proves itself from elsewhere
        run: |
          test -d /tmp/clean || { python -m venv /tmp/clean; /tmp/clean/bin/pip install dist/*.whl; }
          mkdir -p /tmp/elsewhere && cd /tmp/elsewhere
          /tmp/clean/bin/claims-ledger corpus
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    # Trusted Publishing: PyPI mints a short-lived token for this workflow, so there is
    # no long-lived secret in the repository. It needs a publisher configured once at
    # https://pypi.org/manage/project/claims-ledger/settings/publishing/ naming this
    # repository, the workflow file `release.yml` and the environment `pypi`.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
