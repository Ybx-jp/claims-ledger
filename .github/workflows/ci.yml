name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 3.14 is here because this package is developed on it. An interpreter that is
        # developed on but not tested is where a verification goes to be wrong: pathlib
        # changed what it answers for a symlink loop, for a file it may not stat and for
        # a path too long between 3.12 and 3.14, and a defect that only reproduces on one
        # of them was once recorded as fixed because it was checked on the other.
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # validate reads git history for the frozen-region and append-only checks,
          # and the corpus builds real repositories. A shallow clone would leave those
          # checks silently doing nothing, which is the thing this package exists to
          # refuse.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: Type check
        # Configured in pyproject to check src and tests against the 3.11 floor, so a
        # construct that only exists on a newer interpreter cannot pass here.
        run: ty check
      - run: pytest -q
      - name: The corpus proves the checkers
        run: claims-ledger corpus
      - name: The ledger holds the claims about this package
        # Needs the full history checked out above: the entries pin commits.
        run: claims-ledger check

  wheel:
    # The package ships the corpus so that an installed copy can prove itself. That
    # claim is only true if it is tested against a built wheel rather than the source
    # tree, from a directory that is not the checkout.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Install the wheel into a clean environment and run the corpus from elsewhere
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/python -c 'import importlib.metadata as m; r=[x for x in (m.requires("claims-ledger") or []) if "extra ==" not in x]; assert not r, f"the wheel declares runtime dependencies: {r}"'
          mkdir -p /tmp/elsewhere && cd /tmp/elsewhere
          /tmp/clean/bin/claims-ledger corpus
          /tmp/clean/bin/claims-ledger --version
          /tmp/clean/bin/python -m claims_ledger --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: dist
          path: dist/
